name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run unit and component tests
        run: cargo test --workspace
      - name: Build Testament target
        run: cargo build -p misaka
      - name: Run deterministic Testament scenarios
        run: cargo run -p testament -- verify --json
      - name: Run Operator UX smoke suite
        run: cargo run -p testament -- operator-verify
      - name: Run full Network Stream verification
        run: cargo run -p testament -- network-verify --json
      - name: Run relay verification
        run: cargo run -p testament -- relay-verify --json
