name: Cloudflare Gateway v0

# Isolated from the main CI: `gateway/cloudflare` is its own cargo workspace
# (see its Cargo.toml `[workspace]`), so the root `cargo --workspace` jobs
# neither build nor lint it. This job builds + tests the Cloudflare reference
# Gateway and, on a push to main after every gate passes, deploys it.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Cloudflare Free plan gzip limit (hard gate).
  CF_GZIP_LIMIT_KIB: 3072

jobs:
  cloudflare-gateway:
    name: cloudflare-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build-v0.8.5

      - name: Install worker-build
        if: steps.cache-worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm ci || npm install

      - name: Build Wasm (worker-build)
        run: worker-build --release

      - name: Bundle with Wrangler (dry run)
        run: npx wrangler deploy --dry-run --outdir dist | tee wrangler.log

      - name: Verify crypto + DO boot (miniflare)
        # Boots the Worker under the local Workers runtime (Durable Object
        # emulated). Asserts /.well-known/misaka serves GatewayInfo parsed from
        # env, and GET /verify runs the real misaka-core crypto ({"valid":true}).
        run: |
          npx wrangler dev --local --port 8799 \
            --var NETWORK_ID:03030303-0303-0303-0303-030303030303 \
            --var NETWORK_AUTHORITY_PUBLIC_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa &
          WPID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8799/ >/dev/null && break
            sleep 1
          done
          HELLO="$(curl -s http://127.0.0.1:8799/)"
          VERIFY="$(curl -s http://127.0.0.1:8799/verify)"
          INFO="$(curl -s http://127.0.0.1:8799/.well-known/misaka)"
          kill $WPID 2>/dev/null || true
          pkill -f "wrangler dev" 2>/dev/null || true
          pkill -f workerd 2>/dev/null || true
          echo "GET /                  -> $HELLO"
          echo "GET /verify            -> $VERIFY"
          echo "GET /.well-known/misaka-> $INFO"
          test "$HELLO" = "misaka gateway"
          echo "$VERIFY" | grep -q '"valid":true'
          echo "$INFO" | grep -q '"protocol_version":1'

      - name: Durable Object SQL behaviour tests
        # Drives the real Worker/DO under miniflare: announce->peers visibility,
        # same-sequence re-announce refreshing the TTL, and peers nonce replay.
        run: bash tests/do-sql.sh

      - name: Emit size report
        run: |
          {
            echo "Cloudflare Gateway v0 - size report"
            echo
            echo "Wasm raw size: $(stat -c%s build/index_bg.wasm) bytes"
            echo "Final Wrangler upload:"
            grep -E 'Total Upload' wrangler.log || true
          } | tee size-report.txt

      - name: Enforce gzip < 3 MiB
        run: |
          GZIP_KIB=$(cat dist/*.wasm dist/*.js \
            | gzip -9 -c | wc -c | awk '{printf "%d", $1/1024}')
          echo "Final bundle gzip: ${GZIP_KIB} KiB (limit ${CF_GZIP_LIMIT_KIB} KiB)"
          echo "Final bundle gzip: ${GZIP_KIB} KiB" >> size-report.txt
          if [ "$GZIP_KIB" -ge "$CF_GZIP_LIMIT_KIB" ]; then
            echo "::error::Bundle gzip ${GZIP_KIB} KiB exceeds Cloudflare Free limit"
            exit 1
          fi
          echo "Result: PASS"

      - name: Deploy to Cloudflare
        # Real deploy ONLY on push to main, after every gate above passed.
        # PRs, other branches and workflow_dispatch never deploy; a deploy
        # failure fails the job (no continue-on-error). The single source of
        # deployment configuration is GitHub Actions secrets: all four values
        # are injected at deploy time via a secrets file, so `wrangler deploy
        # --dry-run` and the Miniflare test fixtures are unaffected and
        # `[secrets].required` is satisfied by the file (no first-deploy deadlock).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETWORK_ID: ${{ secrets.NETWORK_ID }}
          NETWORK_AUTHORITY_PUBLIC_KEY: ${{ secrets.NETWORK_AUTHORITY_PUBLIC_KEY }}
        run: |
          umask 077
          printf 'NETWORK_ID=%s\nNETWORK_AUTHORITY_PUBLIC_KEY=%s\n' \
            "$NETWORK_ID" "$NETWORK_AUTHORITY_PUBLIC_KEY" > gateway-secrets.env
          npx wrangler deploy --secrets-file gateway-secrets.env
          rm -f gateway-secrets.env

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-gateway-dist
          path: |
            gateway/cloudflare/dist
            gateway/cloudflare/size-report.txt
          if-no-files-found: warn
