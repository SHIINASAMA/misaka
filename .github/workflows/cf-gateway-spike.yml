name: Cloudflare Gateway Packaging Spike

# Isolated from the main CI: `experiments/cf-gateway-spike` is its own cargo
# workspace (see its Cargo.toml `[workspace]`), so the root `cargo --workspace`
# jobs neither build nor lint it. This job only answers one question:
#   can misaka-core be packaged into a Cloudflare-acceptable Worker bundle,
#   with a real PeerRecord::verify() call retained in the Wasm, under 3 MiB gzip.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Cloudflare Free plan gzip limit (hard gate).
  CF_GZIP_LIMIT_KIB: 3072

jobs:
  cf-gateway-spike:
    name: cf-gateway-spike
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/cf-gateway-spike
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-worker-build-v0.8.5

      - name: Install worker-build
        if: steps.cache-worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm ci || npm install

      - name: Build Wasm (worker-build)
        run: worker-build --release

      - name: Bundle with Wrangler (dry run)
        run: npx wrangler deploy --dry-run --outdir dist | tee wrangler.log

      - name: Verify the bundle really runs PeerRecord::verify()
        # The Worker must actually execute the verify path, not just compile.
        # Run it locally in the Workers runtime (miniflare) and assert the
        # crypto/domain chain returns {"valid":true} plus the hello route.
        run: |
          npx wrangler dev --local --port 8799 &
          WPID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8799/ >/dev/null && break
            sleep 2
          done
          HELLO="$(curl -s http://127.0.0.1:8799/)"
          VERIFY="$(curl -s http://127.0.0.1:8799/verify)"
          kill $WPID 2>/dev/null || true
          echo "GET /        -> $HELLO"
          echo "GET /verify  -> $VERIFY"
          test "$HELLO" = "misaka gateway spike"
          echo "$VERIFY" | grep -q '"valid":true'

      - name: Emit size report
        run: |
          {
            echo "Cloudflare Gateway Packaging Spike - size report"
            echo
            echo "Wasm raw size: $(stat -c%s build/index_bg.wasm) bytes"
            echo "Final Wrangler upload:"
            grep -E 'Total Upload' wrangler.log || true
          } | tee size-report.txt

      - name: Enforce gzip < 3 MiB
        run: |
          GZIP_KIB=$(cat dist/*.wasm dist/*.js \
            | gzip -9 -c | wc -c | awk '{printf "%d", $1/1024}')
          echo "Final bundle gzip: ${GZIP_KIB} KiB (limit ${CF_GZIP_LIMIT_KIB} KiB)"
          echo "Final bundle gzip: ${GZIP_KIB} KiB" >> size-report.txt
          if [ "$GZIP_KIB" -ge "$CF_GZIP_LIMIT_KIB" ]; then
            echo "::error::Bundle gzip ${GZIP_KIB} KiB exceeds Cloudflare Free limit"
            exit 1
          fi
          echo "Result: PASS"

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-gateway-spike-dist
          path: |
            experiments/cf-gateway-spike/dist
            experiments/cf-gateway-spike/size-report.txt
          if-no-files-found: warn
