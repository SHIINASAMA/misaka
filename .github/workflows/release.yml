name: Release

# Tag-triggered only: a release is never produced by an ordinary `main` push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the workspace package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag workspace_version=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match workspace version $pkg"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # Embedded by `misaka version --json` (option_env!) for local builds it is
      # simply "unknown".
      MISAKA_BUILD_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - name: Build misaka
        run: cargo build --release -p misaka --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="misaka-v${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/misaka" "dist/${name}/"
          [ -f README.md ] && cp README.md "dist/${name}/" || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: misaka-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, glob
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assets = []
          for path in sorted(glob.glob("dist/*.tar.gz")):
              name = os.path.basename(path)
              sha = hashlib.sha256(open(path, "rb").read()).hexdigest()
              prefix = f"misaka-v{version}-"
              target = name[len(prefix):-len(".tar.gz")] if name.startswith(prefix) else name
              assets.append({"target": target, "name": name, "sha256": sha})
          manifest = {
              "version": version,
              "git_sha": os.environ["GITHUB_SHA"],
              "assets": assets,
          }
          with open("dist/release-manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
