name = "misaka-gateway-cloudflare"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
# GitHub Actions installs Rust, the wasm32 target, and worker-build (0.8.5),
# then runs both the build and the deploy, so the build command is the plain
# worker-build invocation. Cloudflare Workers Builds is not used.
command = "worker-build --release"

# One Durable Object per Network holds the signed-PeerRecord directory and the
# nonce-replay set in DO SQLite storage (strongly-consistent single writer).
[[durable_objects.bindings]]
name = "GATEWAY_DIRECTORY"
class_name = "GatewayDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayDirectory"]

# Network-specific deployment configuration is NEVER stored here. The two
# values below are injected by the deployment environment (Cloudflare secrets
# in production, `.dev.vars` for local, explicit test vars in CI). They are
# declared required so `wrangler deploy` fails if unset. They are managed as
# secrets for deployment isolation / repository hygiene, not because they are
# confidential: `NETWORK_AUTHORITY_PUBLIC_KEY` is a public key, and the Network
# Authority PRIVATE key is never deployed to a Gateway. One Gateway serves one
# Network; different deployments point at different Networks and share no state.
[secrets]
required = [
  "NETWORK_ID",
  "NETWORK_AUTHORITY_PUBLIC_KEY",
]
