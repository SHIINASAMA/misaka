[workspace]
resolver = "2"
members = [
    "crates/misaka-core",
    "crates/misaka-network",
    "crates/misaka-runtime",
    "crates/misaka-cli",
    "crates/testament",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
rand = "0.8"
sysinfo = "0.30"
simple-mdns = { version = "0.7", features = ["async-tokio"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
