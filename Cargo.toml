[workspace]
resolver = "2"
members = [
    "crates/misaka-core",
    "crates/misaka-network",
    "crates/misaka-runtime",
    "crates/misaka-cli",
    "crates/misaka-api",
    "crates/misaka-gatewayd",
    "crates/testament",
    "crates/misaka-relay",
]

[workspace.package]
version = "2026.9.18"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sysinfo = "0.30"
simple-mdns = { version = "0.7", features = ["async-tokio"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
iroh = { version = "1.1", default-features = false, features = ["tls-aws-lc-rs"] }
clap = { version = "4", features = ["derive"] }

# Compile-side disk/size control. The dependency tree (iroh, aws-lc-sys, ring,
# icu, rustls, hyper, reqwest) is large, and full DWARF debug info for those
# third-party crates dominates `target/` and can push the linker over the disk
# budget on constrained runners. Third-party crates build with no debug info;
# workspace crates keep their own (small) debug info for readable panics.
[profile.dev.package."*"]
debug = false
[profile.test.package."*"]
debug = false

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
