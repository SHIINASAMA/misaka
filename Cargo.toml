[package]
name = "misaka"
version = "0.1.0"
edition = "2021"
description = "Decentralized computing network - each Sister works independently"

[dependencies]
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
futures-util = "0.3"
simple-mdns = { version = "0.7", features = ["async-tokio"] }
